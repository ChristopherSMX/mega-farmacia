
```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Inicio de sesión del sistema Mega Farmacia">

    <title>Mega Farmacia | Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #263238;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            font-weight: normal;
        }

        .subtitle {
            text-align: center;
            color: #607d8b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #90a4ae;
            border-color: #546e7a;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #263238;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.85;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #455a64;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .security-message {
            margin-top: 25px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
            color: #607d8b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                Mega <span>Farmacia</span>
            </div>

            <p class="subtitle">
                Acceso al sistema de gestión
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        maxlength="128"
                    >
                </div>

                <button
                    type="submit"
                    class="login-button">
                    Iniciar sesión
                </button>

            </form>

            <a
                href="../index.html"
                class="back-link">
                ← Regresar al inicio
            </a>

            <div class="security-message">
                Este formulario corresponde a la interfaz inicial.
                La autenticación será implementada posteriormente
                mediante mecanismos seguros.
            </div>

        </section>

    </main>

</body>
</html>
```
